apiVersion: v1
kind: Service
metadata: { name: ledger, namespace: orders }
spec:
  clusterIP: None
  selector: { app: ledger }
  ports: [{ name: tcp, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: ledger, namespace: orders }
spec:
  serviceName: ledger
  replicas: 1
  selector:
    matchLabels: { app: ledger }
  template:
    metadata:
      labels: { app: ledger }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ledger
          image: busybox:1.36
          command: ["sh", "-c", "touch /data/ledger.log; tail -f /data/ledger.log"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        # premium-rwo is the SSD class on GKE. kind uses its default class, so the test script overrides this.
        storageClassName: premium-rwo
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ledger-backup, namespace: orders }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
# File-level backup of the ledger volume. The managed Backup for GKE plan in terraform/modules/backup covers the volume
# and the Kubernetes objects; this job is the portable fallback and what the kind test exercises.
apiVersion: batch/v1
kind: CronJob
metadata: { name: ledger-backup, namespace: orders }
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
          affinity:
            # A ReadWriteOnce disk attaches to one node, so the backup pod must land next to the ledger pod.
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: { matchLabels: { app: ledger } }
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: busybox:1.36
              command: ["sh", "-c", "cp /data/ledger.log /backup/ledger.log.$(date +%s) && ls -l /backup"]
              resources: { requests: { cpu: 50m, memory: 32Mi } }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: backup, mountPath: /backup }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: data-ledger-0 }
            - name: backup
              persistentVolumeClaim: { claimName: ledger-backup }

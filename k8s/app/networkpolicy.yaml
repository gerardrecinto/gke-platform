apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: orders
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-and-lb
  namespace: orders
spec:
  podSelector:
    matchLabels: { app: orders-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    # Google load balancer and health check source ranges.
    - from:
        - ipBlock: { cidr: 130.211.0.0/22 }
        - ipBlock: { cidr: 35.191.0.0/16 }
      ports:
        - { port: 8080, protocol: TCP }

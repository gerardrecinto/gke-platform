apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orders
  annotations:
    # Container-native load balancing: the load balancer targets pod IPs directly through a network endpoint group.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "orders-api"}'
spec:
  selector: { app: orders-api }
  ports:
    - { name: http, port: 80, targetPort: http }

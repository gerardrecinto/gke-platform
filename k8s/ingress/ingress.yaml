apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata: { name: orders-api, namespace: orders }
spec:
  timeoutSec: 30
  connectionDraining: { drainingTimeoutSec: 60 }
  healthCheck:
    type: HTTP
    requestPath: /
    port: 8080
    checkIntervalSec: 10
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata: { name: orders-api, namespace: orders }
spec:
  redirectToHttps: { enabled: true }
  sslPolicy: orders-modern
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata: { name: orders-api, namespace: orders }
spec:
  domains: [orders.example.com]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-api
  namespace: orders
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: orders-api-ip
    networking.gke.io/managed-certificates: orders-api
    networking.gke.io/v1beta1.FrontendConfig: orders-api
spec:
  defaultBackend:
    service: { name: orders-api, port: { number: 80 } }
  rules:
    - host: orders.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: orders-api, port: { number: 80 } }

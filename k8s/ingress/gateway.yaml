# The same route through Gateway API, the successor to Ingress on GKE.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: orders, namespace: orders }
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: orders-api, namespace: orders }
spec:
  parentRefs: [{ name: orders }]
  hostnames: [orders.example.com]
  rules:
    - backendRefs: [{ name: orders-api, port: 80 }]

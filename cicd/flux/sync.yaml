# Flux CD: the same job as cicd/argocd, pull-based. Flux watches the repo and applies k8s/app, and puts back anything changed by hand.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gke-platform
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/gerardrecinto/gke-platform
  ref: { branch: main }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orders
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/app
  prune: true
  wait: true
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: gke-platform

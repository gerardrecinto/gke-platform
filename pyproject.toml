[project]
name = "gkeplan"
version = "0.1.0"
description = "GKE capacity maths: node allocatable, HPA replicas, VPA-style requests, Cluster Autoscaler node count."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
